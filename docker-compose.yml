services:
  db:
    image: postgres:16
    container_name: naranote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: naranote
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naranote}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # Host port 5433, not 5432: a native PostgreSQL 18 service already owns 5432
    # on this machine and would silently shadow the container.
    ports:
      - "5433:5432"
    volumes:
      - naranote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naranote} -d naranote"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naranote-pgdata:
