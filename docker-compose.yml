services:
  db:
    image: postgres:16
    container_name: naranote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: naranote
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naranote}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # Host port 5433, not 5432: a native PostgreSQL 18 service already owns 5432
    # on this machine and would silently shadow the container.
    ports:
      - "5433:5432"
    volumes:
      - naranote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naranote} -d naranote"]
      interval: 5s
      timeout: 5s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: naranote-voicevox
    restart: unless-stopped
    # Not published to the host — only the backend talks to it, same as db's
    # internal port vs its host-facing 5433 mapping.

  backend:
    build: ./backend
    container_name: naranote-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      voicevox:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naranote}
      # Service name and the container's own port, not the 5433 host mapping
      # meant for connections from outside the compose network.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/naranote
      NARANOTE_DATA_DIR: /data
      NARANOTE_VOICEVOX_URL: http://voicevox:50021
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - naranote-m2:/root/.m2
      - ./data:/data

  frontend:
    build: ./frontend
    container_name: naranote-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Shadows the bind mount above at this one path — node_modules is
      # built inside the container (npm ci in frontend/Dockerfile) and must
      # not be replaced by whatever npm installed on the host.
      - /app/node_modules

volumes:
  naranote-pgdata:
  naranote-m2:
