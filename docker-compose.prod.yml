# The deployable shape: one app container (frontend built and embedded into
# the backend jar, see the root Dockerfile) plus the database. No frontend
# service, no bind mounts, no dev-only ports.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# POSTGRES_PASSWORD, NARANOTE_ENCRYPTION_KEY and the NARANOTE_MAIL_*/NARANOTE_APP_BASE_URL
# vars have no default here on purpose — unlike docker-compose.yml's dev convenience
# (Mailpit, localhost), a real deployment must not be able to silently start on values
# baked into application.yaml/the dev compose file. Set all of these in a gitignored .env
# at the repo root (Compose reads it automatically); if the required ones are unset,
# Postgres refuses to initialize and CryptoService refuses to build an AES key, so this
# fails fast instead of running insecure. A missing mail var won't fail startup the same
# way — sending will just fail at runtime and get logged (see EmailService) — so double-check
# NARANOTE_MAIL_HOST/PORT/USERNAME/PASSWORD/FROM and NARANOTE_APP_BASE_URL are actually set.
services:
  db:
    image: postgres:16
    container_name: naranote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: naranote
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - naranote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naranote} -d naranote"]
      interval: 5s
      timeout: 5s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: naranote-voicevox
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naranote-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      voicevox:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/naranote
      NARANOTE_DATA_DIR: /data
      NARANOTE_VOICEVOX_URL: http://voicevox:50021
      NARANOTE_ENCRYPTION_KEY: ${NARANOTE_ENCRYPTION_KEY}
      NARANOTE_COOKIE_SECURE: "true"
      NARANOTE_APP_BASE_URL: ${NARANOTE_APP_BASE_URL}
      NARANOTE_MAIL_HOST: ${NARANOTE_MAIL_HOST}
      NARANOTE_MAIL_PORT: ${NARANOTE_MAIL_PORT}
      NARANOTE_MAIL_USERNAME: ${NARANOTE_MAIL_USERNAME}
      NARANOTE_MAIL_PASSWORD: ${NARANOTE_MAIL_PASSWORD}
      NARANOTE_MAIL_SMTP_AUTH: "true"
      NARANOTE_MAIL_SMTP_STARTTLS: "true"
      NARANOTE_MAIL_FROM: ${NARANOTE_MAIL_FROM}
    ports:
      - "8080:8080"
    # Optional: only needed to run the one-off --import-kanji /
    # --import-dictionary commands against a prod-shaped image.
    volumes:
      - ./data:/data

volumes:
  naranote-pgdata:
