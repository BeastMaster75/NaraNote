# The deployable shape: one app container (frontend built and embedded into
# the backend jar, see the root Dockerfile) plus the database. No frontend
# service, no bind mounts, no dev-only ports.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# POSTGRES_PASSWORD and NARANOTE_ENCRYPTION_KEY have no default here on purpose —
# unlike docker-compose.yml's dev convenience, a real deployment must not be able to
# silently start on the known values baked into application.yaml/the dev compose file.
# Set both in a gitignored .env at the repo root (Compose reads it automatically); if
# either is unset Compose passes an empty value, Postgres refuses to initialize and
# CryptoService refuses to build an AES key, so this fails fast instead of running insecure.
services:
  db:
    image: postgres:16
    container_name: naranote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: naranote
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - naranote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naranote} -d naranote"]
      interval: 5s
      timeout: 5s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: naranote-voicevox
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naranote-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      voicevox:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naranote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/naranote
      NARANOTE_DATA_DIR: /data
      NARANOTE_VOICEVOX_URL: http://voicevox:50021
      NARANOTE_ENCRYPTION_KEY: ${NARANOTE_ENCRYPTION_KEY}
      NARANOTE_COOKIE_SECURE: "true"
    ports:
      - "8080:8080"
    # Optional: only needed to run the one-off --import-kanji /
    # --import-dictionary commands against a prod-shaped image.
    volumes:
      - ./data:/data

volumes:
  naranote-pgdata:
